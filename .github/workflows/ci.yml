name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # A suíte completa exige o modo completo (root, systemd, /proc): é Linux. macOS e Windows rodam o modo leve (job `lite`).
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      # The daemon's code-ownership tests require a root-owned installed package.
      - run: sudo env "PATH=$PATH" "$(command -v python)" -m pip install .
      # Existing privileged filesystem tests must run, not be skipped for lack of uid 0.
      # /tmp has a root-owned sticky parent on both runners; runner-private TMPDIR does not.
      - name: Test suite (disposable resources only)
        run: sudo env TMPDIR=/tmp "$(command -v python)" -W ignore -m unittest discover -s tests -t . -v
      - name: CLI and offline example
        run: |
          aao --version
          aao --help
          aao check-rules --file rules/BASE_RULES.example.md
          python examples/offline_relay.py

  lite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # O contexto `runner` não existe no `env` do job: os diretórios do pipx entram pelo GITHUB_ENV.
      - name: Isolated pipx directories
        run: |
          echo "PIPX_HOME=$RUNNER_TEMP/aao-pipx" >> "$GITHUB_ENV"
          echo "PIPX_BIN_DIR=$RUNNER_TEMP/aao-bin" >> "$GITHUB_ENV"
      - name: Install with pipx
        run: |
          python -m pip install pipx
          python -m pipx install --python "$(python -c 'import sys; print(sys.executable)')" .
          BIN="$(python -m pipx environment --value PIPX_BIN_DIR)"
          "$BIN/aao" --version
      - name: Test clean installed CLI without provider credentials
        run: python tests/installation_smoke.py
      - name: Unattended setup works on this OS (no pwd/uid, no POSIX directory flags)
        run: |
          python -m pip install .
          python -m ai_agents_orchestrator setup --non-interactive --output-dir "$RUNNER_TEMP/aao-demo"
          test -f "$RUNNER_TEMP/aao-demo/config.toml"
      - name: Test lite runtime without root or systemd
        run: |
          python -m pip install .
          python -m unittest tests.test_lite tests.test_windows tests.test_plugin -v
      - name: Run full suite on Windows (Linux-only cases explain their skips)
        if: runner.os == 'Windows'
        run: python -W ignore -m unittest discover -s tests -t . -v
      - name: Repeat concurrency regressions 20 times
        run: python -c "import subprocess,sys; [subprocess.run([sys.executable, '-m', 'unittest', 'tests.test_windows', 'tests.test_lite.LiteWorkflow.test_single_user_service_lock'], check=True) for _ in range(20)]"

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: mypy
      - name: Release files name one version, and the CHANGELOG has notes for it
        run: python scripts/check_release.py
      - name: No private paths, personal mailboxes or chat ids in tracked files
        run: python scripts/check_private_paths.py
      # Windows-only branches (ctypes, msvcrt, no AF_UNIX) are only visible when type-checking for that platform.
      - name: mypy for Windows (portable modules)
        run: mypy --platform win32 src/ai_agents_orchestrator/lite.py src/ai_agents_orchestrator/ipc.py src/ai_agents_orchestrator/compat.py src/ai_agents_orchestrator/medicao.py src/ai_agents_orchestrator/config.py src/ai_agents_orchestrator/batchqueue.py

  # No USER, LANG, TZ or tokens: what a stranger's shell may well look like. Passing here is what keeps a test from
  # depending on the runner by accident.
  clean-env:
    name: Empty environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Unit tests under `env -i`
        run: |
          mkdir -p "$RUNNER_TEMP/h/Local" "$RUNNER_TEMP/h/Roaming"
          if [ "$RUNNER_OS" = "Windows" ]; then
            # (tests.test_windows starts PowerShell, which is too slow to cold-start without its own variables; it runs in `lite`.)
            # Windows itself always provides these; the point is to drop everything else (tokens, CI markers, locale, TZ).
            env -i SYSTEMROOT="$SYSTEMROOT" WINDIR="$WINDIR" COMSPEC="$COMSPEC" PATHEXT="$PATHEXT" PATH="$PATH" \
              TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" USERNAME="$USERNAME" USERPROFILE="$RUNNER_TEMP\\h" \
              LOCALAPPDATA="$RUNNER_TEMP\\h\\Local" APPDATA="$RUNNER_TEMP\\h\\Roaming" HOME="$RUNNER_TEMP/h" PYTHONUTF8=1 \
              python -W ignore -m unittest tests.test_clean_install tests.test_lite tests.test_batchqueue tests.test_docs
          else
            env -i PATH="$PATH" HOME="$RUNNER_TEMP/h" TMPDIR="$RUNNER_TEMP" PYTHONUTF8=1 \
              python -W ignore -m unittest tests.test_clean_install tests.test_lite tests.test_windows tests.test_batchqueue tests.test_docs
          fi

  # The first line of the README, exactly as a visitor runs it, but pinned to the commit under test.
  pipx-from-github:
    name: pipx install from GitHub (${{ matrix.os }})
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Isolated pipx directories
        run: |
          echo "PIPX_HOME=$RUNNER_TEMP/aao-pipx" >> "$GITHUB_ENV"
          echo "PIPX_BIN_DIR=$RUNNER_TEMP/aao-bin" >> "$GITHUB_ENV"
      - name: pipx install git+URL@SHA
        run: |
          python -m pip install pipx
          python -m pipx install "git+https://github.com/${GITHUB_REPOSITORY}@${SOURCE_SHA}"
          echo "$RUNNER_TEMP/aao-bin" >> "$GITHUB_PATH"
      - name: Installed CLI runs, sets up and checks itself
        run: |
          aao --version
          aao setup --non-interactive --output-dir "$RUNNER_TEMP/aao-demo"
          test -f "$RUNNER_TEMP/aao-demo/config.toml"
          rc=0; AAO_CONFIG="$RUNNER_TEMP/aao-demo/config.toml" aao doctor || rc=$?
          test "$rc" -le 1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.24.2"
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: Full history and current tree (also beyond the event diff)
        run: |
          gitleaks git --log-opts=--all --redact --no-banner
          gitleaks dir --redact --no-banner .

  clean-install:
    name: Empty Linux container / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    container: python:${{ matrix.python }}-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install only the Git fixture prerequisite
        run: apt-get update && apt-get install -y --no-install-recommends git
      - name: Fresh venv, pip install ., setup, doctor, fake task and plugin
        run: sh scripts/clean-install-test.sh --empty

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install '.[dev]'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install and exercise both artifacts
        run: |
          sh scripts/clean-install-test.sh --distribution dist/*.whl
          sh scripts/clean-install-test.sh --distribution dist/*.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
