name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        run: python -m pip install .
      - name: Run the test suite
        run: python -W ignore -m unittest discover -s tests -t . -v
      - name: CLI smoke test
        run: |
          aao --version
          aao --help
          aao check-rules --file rules/BASE_RULES.example.md

  lite:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PIPX_HOME: ${{ runner.temp }}/aao-pipx
      PIPX_BIN_DIR: ${{ runner.temp }}/aao-bin
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with pipx
        run: |
          python -m pip install pipx
          python -m pipx install .
      - name: Test clean installed CLI without provider credentials
        run: python tests/installation_smoke.py
      - name: Test lite runtime without root or systemd
        run: |
          python -m pip install .
          python -m unittest tests.test_lite tests.test_windows tests.test_plugin -v
      - name: Run full suite on Windows (Linux-only cases explain their skips)
        if: runner.os == 'Windows'
        run: python -W ignore -m unittest discover -s tests -t . -v
      - name: Repeat concurrency regressions 20 times
        run: python -c "import subprocess,sys; [subprocess.run([sys.executable, '-m', 'unittest', 'tests.test_windows', 'tests.test_lite.LiteWorkflow.test_single_user_service_lock'], check=True) for _ in range(20)]"
