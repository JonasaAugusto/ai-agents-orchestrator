[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agents-orchestrator"
version = "1.3.0"
description = "Run Claude Code and OpenAI Codex CLI as a relay team on your own subscriptions: task board, chat approvals, cross-review and automatic handoff on usage limits."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jonas Augusto" }]
requires-python = ">=3.11"
dependencies = ["tzdata; sys_platform == 'win32'"]
keywords = ["claude-code", "codex", "ai-agents", "orchestration", "telegram", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
]

[project.optional-dependencies]
whatsapp = ["neonize>=0.3"]
dev = ["ruff==0.17.4", "mypy==2.4.1", "build==1.6.1", "twine==7.0.0"]

[project.urls]
Homepage = "https://github.com/JonasaAugusto/ai-agents-orchestrator"
Issues = "https://github.com/JonasaAugusto/ai-agents-orchestrator/issues"
Changelog = "https://github.com/JonasaAugusto/ai-agents-orchestrator/blob/main/CHANGELOG.md"

[project.scripts]
aao = "ai_agents_orchestrator.cli:main"
ai-agents-orchestrator = "ai_agents_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/ai-agents-orchestrator/rules" = ["rules/BASE_RULES.example.md", "rules/DIVISION.example.md"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# Start with correctness checks; formatting the legacy code is a separate change.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Existing unused imports only. New files receive the full checks above.
"src/ai_agents_orchestrator/bot.py" = ["F401"]
"src/ai_agents_orchestrator/doctor.py" = ["F401"]
"src/ai_agents_orchestrator/testing.py" = ["F401"]
"tests/helpers.py" = ["F401"]
"tests/test_chat.py" = ["F401"]
"tests/test_doctor_setup.py" = ["F401"]
"tests/test_garantias.py" = ["F401"]
"tests/test_historico.py" = ["F401"]
"tests/test_origem.py" = ["F401"]
"tests/test_seguranca.py" = ["F401", "F811"]

[tool.mypy]
python_version = "3.11"
files = ["src/ai_agents_orchestrator/assistente.py", "src/ai_agents_orchestrator/mcp.py", "scripts/clean_install_test.py", "examples/offline_relay.py"]
follow_imports = "silent"
ignore_missing_imports = true
warn_unused_ignores = true
